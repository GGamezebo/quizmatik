[plugin]

name="Web lossy textures"
description="Web exports (feature web) ship big PNG/JPG textures as one lossy WebP instead of two VRAM-compressed copies (S3TC + ETC2). Imports stay VRAM Compressed, so Android / desktop exports are untouched. Settings: Project Settings > export/web_lossy_textures (Advanced)."
author="Quizmatik"
version="1.0"
script="plugin.gd"
