  <rect x="71" y="88" width="18" height="58" fill="#F08A2C" stroke="#2A3340" stroke-width="4"/>
  <path d="M76 96 L76 140" stroke="#FFC074" stroke-width="3" stroke-linecap="round"/>
  <!-- Lid tossed to the side -->
  <path d="M104 52 L150 66 L142 92 L96 78 Z" fill="#7E5DB0" stroke="#2A3340" stroke-width="5" stroke-linejoin="round"/>
  <path d="M121 57 L113 84" stroke="#F08A2C" stroke-width="9"/>
  <path d="M121 57 L113 84" stroke="#2A3340" stroke-width="2" opacity="0.5"/>
