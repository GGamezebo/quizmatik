    <path d="M52 92 L22 10 L58 26 Z"/>
    <path d="M64 90 L66 4 L88 30 Z"/>
    <path d="M90 92 L126 14 L132 46 Z"/>
  </g>
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round">
    <rect x="34" y="88" width="92" height="58" rx="8"/>
    <path d="M104 52 L150 66 L142 92 L96 78 Z"/>
  </g>
  <!-- Box body (open top) -->
  <rect x="34" y="88" width="92" height="58" rx="8" fill="#6B4E99" stroke="#2A3340" stroke-width="5"/>
  <path d="M38 94 L122 94" stroke="#3A2C52" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <g stroke="#57407F" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
    <path d="M40 142 L54 128"/><path d="M54 144 L70 128"/><path d="M94 144 L110 128"/>
