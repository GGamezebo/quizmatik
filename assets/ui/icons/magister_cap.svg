  <path d="M196 160 L220 160 L228 214 L188 214 Z" fill="#E8B64C" stroke="#2A3340" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#B5852A" stroke-width="4" stroke-linecap="round">
    <path d="M200 176 L198 206"/>
    <path d="M208 176 L208 206"/>
    <path d="M216 176 L218 206"/>
