  <!-- Sparkle -->
  <path d="M44 150 L50 164 L64 170 L50 176 L44 190 L38 176 L24 170 L38 164 Z" fill="#F2C14E" stroke="#2A3340" stroke-width="5" stroke-linejoin="round"/>
