    <path d="M166 176 L186 152"/>
  </g>
  <!-- Board -->
  <path d="M128 40 L238 92 L128 144 L18 92 Z" fill="#7A5AB5" stroke="#2A3340" stroke-width="9" stroke-linejoin="round"/>
  <path d="M128 56 L206 92 L128 128 L50 92 Z" fill="none" stroke="#9B7FD0" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
