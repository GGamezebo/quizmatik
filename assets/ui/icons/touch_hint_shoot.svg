    <path d="M194 128 L226 128"/>
  </g>
  <!-- Ink drop -->
  <path d="M128 92 C142 112 154 124 154 140 A26 26 0 0 1 102 140 C102 124 114 112 128 92 Z" fill="#2A3340"/>
  <path d="M116 138 A12 12 0 0 0 124 152" fill="none" stroke="#F3E6C8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
