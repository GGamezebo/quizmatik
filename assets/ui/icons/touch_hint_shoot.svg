  <circle cx="128" cy="128" r="70" fill="none" stroke="#2A3340" stroke-width="7" stroke-dasharray="22 14" stroke-linecap="round"/>
  <!-- Crosshair ticks -->
  <g stroke="#2A3340" stroke-width="9" stroke-linecap="round">
    <path d="M128 30 L128 62"/>
    <path d="M128 194 L128 226"/>
